<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chemistry Study Buddy: a Chemistry study assistant with a Nigerian Pidgin voice.">
  <link rel="stylesheet" href="style.css">
  <title>Chemistry Study Buddy</title>
</head>
<body>
<div class="book">
  <div class="app-inner">
    <div class="header-fixed">
      <h1 id="app-title">Chemistry Study Buddy</h1>
      <p id="app-subtitle">Your Chemistry study companion, plain English or Pidgin, your choice.</p>
      <div class="voice-toggle">
        <span class="tick active" id="tickPlain">Plain English</span>
        <span class="tick" id="tickPidgin">Pidgin</span>
      </div>
    </div>

    <div class="page" id="page">
      <div class="msg bot">
        <div class="tag">Big Bro</div>
        <div class="bubble">Ehen, welcome! Ask me anything on Chemistry.</div>
      </div>
    </div>
      

    <div class="composer-fixed">
      <div class="composer">
        <input type="text" id="inputBox" placeholder="Ask a Chemistry question...">
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>
</div>
  <script src="script.js"></script>
</body>
</html>
